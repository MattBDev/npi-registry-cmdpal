name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  Solution_Name: NpiRegistry.sln

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x64, ARM64]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore ${{ env.Solution_Name }} -p:Platform=${{ matrix.platform }}

    - name: Build
      run: dotnet build ${{ env.Solution_Name }} --no-restore -c ${{ matrix.configuration }} -p:Platform=${{ matrix.platform }}

  package:
    # Unsigned MSIX for inspection; it must be signed before it can be installed.
    needs: build
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Create MSIX package
      run: >
        dotnet build ${{ env.Solution_Name }} -c Release
        -p:Platform=${{ matrix.platform }}
        -p:GenerateAppxPackageOnBuild=true
        -p:AppxPackageSigningEnabled=false
        -p:AppxPackageDir="${{ github.workspace }}\AppPackages\"

    - name: Upload MSIX package
      uses: actions/upload-artifact@v4
      with:
        name: msix-${{ matrix.platform }}
        path: AppPackages
        if-no-files-found: error
